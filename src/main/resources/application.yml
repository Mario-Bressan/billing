server:
  port: 8081

spring:
  application:
    name: tb-billing-consumer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kafka_lab}
    username: ${DB_USERNAME:kafka}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: tb-billing-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tb.billing.adapter.in.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.tb.billing.adapter.in.kafka.PedidoEventPayload
    listener:
      ack-mode: manual_immediate
      sync-commits: true
      concurrency: 3

logging:
  level:
    com.tb: DEBUG
    org.springframework.kafka: INFO
